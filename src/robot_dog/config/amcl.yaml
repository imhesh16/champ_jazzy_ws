amcl:
  ros__parameters:
    use_sim_time: true

    # Frames
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"

    # Tópicos
    scan_topic: "scan"
    map_topic: "map"

    # Modelo de movimiento
    # Primero usamos Differential para asegurar funcionamiento.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # Ruido de odometría
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Modelo del LiDAR
    laser_model_type: "likelihood_field"
    laser_min_range: -1.0
    laser_max_range: -1.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60

    sigma_hit: 0.2
    lambda_short: 0.1

    z_hit: 0.5
    z_rand: 0.5
    z_short: 0.05
    z_max: 0.05

    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    # Filtro de partículas
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # Actualización
    update_min_d: 0.03
    update_min_a: 0.05

    # TF map -> odom
    tf_broadcast: true
    transform_tolerance: 1.0

    # Pose inicial desde RViz
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

    save_pose_rate: 0.5
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
