# ============================================================
# NAV2 - NOVA SPOT MICRO
# ROS 2 JAZZY + GAZEBO HARMONIC
#
# Localización:
#   map -> odom -> base_footprint -> base_link
#
# Sensor LiDAR:
#   /scan
#
# Salida final de velocidad:
#   /cmd_vel
# ============================================================


# ============================================================
# BT NAVIGATOR
# Recibe las metas enviadas desde RViz y coordina Nav2
# ============================================================

bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: "map"
    robot_base_frame: "base_footprint"
    odom_topic: "/odom"

    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0

    navigators:
      - "navigate_to_pose"
      - "navigate_through_poses"

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code


# ============================================================
# CONTROLLER SERVER
# Control local de seguimiento de trayectoria
# ============================================================

controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 10.0
    costmap_update_timeout: 1.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.5

    progress_checker_plugins:
      - "progress_checker"

    goal_checker_plugins:
      - "general_goal_checker"

    controller_plugins:
      - "FollowPath"

    # --------------------------------------------------------
    # Verifica que el robot avance durante la navegación
    # --------------------------------------------------------

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"

      # Movimiento mínimo para considerar que existe progreso
      required_movement_radius: 0.03

      # Tiempo amplio debido a la baja velocidad del cuadrúpedo
      movement_time_allowance: 30.0

    # --------------------------------------------------------
    # Tolerancia para considerar alcanzada la meta
    # --------------------------------------------------------

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true

      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20

    # --------------------------------------------------------
    # REGULATED PURE PURSUIT
    # --------------------------------------------------------

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Velocidad estable probada en el robot
      desired_linear_vel: 0.05

      # Distancia del punto que sigue el controlador
      lookahead_dist: 0.25
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.35
      lookahead_time: 1.5

      # Inicialmente usamos una distancia fija
      use_velocity_scaled_lookahead_dist: false

      # Giro previo para alinearse con la trayectoria
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.04
      rotate_to_heading_min_angle: 0.35
      max_angular_accel: 0.10

      transform_tolerance: 0.30

      # Reducción de velocidad al aproximarse a la meta
      min_approach_linear_velocity: 0.02
      approach_velocity_scaling_dist: 0.30

      # Comprobación de colisiones sobre la trayectoria
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      # Reducción de velocidad en curvas
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.35
      regulated_linear_scaling_min_speed: 0.03

      # Se deja desactivado inicialmente para evitar
      # velocidades excesivamente bajas cerca de obstáculos
      use_cost_regulated_linear_velocity_scaling: false

      cost_scaling_dist: 0.25
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0

      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25

      max_robot_pose_search_dist: 3.0
      interpolate_curvature_after_goal: false


# ============================================================
# LOCAL COSTMAP
# Obstáculos cercanos detectados en tiempo real
# ============================================================

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: "odom"
      robot_base_frame: "base_footprint"

      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.30

      rolling_window: true

      width: 3
      height: 3
      resolution: 0.05

      # Huella aproximada del cuadrúpedo:
      # 0.36 m de largo por 0.28 m de ancho
      footprint: "[[0.18, 0.14], [0.18, -0.14], [-0.18, -0.14], [-0.18, 0.14]]"
      footprint_padding: 0.02

      plugins:
        - "obstacle_layer"
        - "inflation_layer"

      # ------------------------------------------------------
      # Obstáculos detectados por el LiDAR
      # ------------------------------------------------------

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: "scan"

        scan:
          topic: "/scan"
          data_type: "LaserScan"

          clearing: true
          marking: true

          obstacle_min_range: 0.0
          obstacle_max_range: 2.5

          raytrace_min_range: 0.0
          raytrace_max_range: 3.0

          min_obstacle_height: 0.0
          max_obstacle_height: 1.5

      # ------------------------------------------------------
      # Distancia de seguridad alrededor de obstáculos
      # ------------------------------------------------------

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true

        inflation_radius: 0.35
        cost_scaling_factor: 5.0

      always_send_full_costmap: true


# ============================================================
# GLOBAL COSTMAP
# Mapa completo utilizado por el planificador global
# ============================================================

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: "map"
      robot_base_frame: "base_footprint"

      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.30

      resolution: 0.05
      track_unknown_space: true

      footprint: "[[0.18, 0.14], [0.18, -0.14], [-0.18, -0.14], [-0.18, 0.14]]"
      footprint_padding: 0.02

      plugins:
        - "static_layer"
        - "obstacle_layer"
        - "inflation_layer"

      # ------------------------------------------------------
      # Mapa guardado previamente
      # ------------------------------------------------------

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true

      # ------------------------------------------------------
      # Obstáculos actuales detectados por el LiDAR
      # ------------------------------------------------------

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: "scan"

        scan:
          topic: "/scan"
          data_type: "LaserScan"

          clearing: true
          marking: true

          obstacle_min_range: 0.0
          obstacle_max_range: 2.5

          raytrace_min_range: 0.0
          raytrace_max_range: 3.0

          min_obstacle_height: 0.0
          max_obstacle_height: 1.5

      # ------------------------------------------------------
      # Inflación global de obstáculos
      # ------------------------------------------------------

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true

        inflation_radius: 0.35
        cost_scaling_factor: 5.0

      always_send_full_costmap: true


# ============================================================
# PLANNER SERVER
# Generación de la trayectoria global
# ============================================================

planner_server:
  ros__parameters:
    use_sim_time: true

    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0

    planner_plugins:
      - "GridBased"

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"

      tolerance: 0.20
      use_astar: false

      # Se permite porque el mapa del warehouse no está
      # completamente explorado en todas sus zonas
      allow_unknown: true


# ============================================================
# SMOOTHER SERVER
# Suaviza geométricamente la trayectoria global
# ============================================================

smoother_server:
  ros__parameters:
    use_sim_time: true

    smoother_plugins:
      - "simple_smoother"

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"

      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true


# ============================================================
# BEHAVIOR SERVER
# Comportamientos de recuperación de Nav2
# ============================================================

behavior_server:
  ros__parameters:
    use_sim_time: true

    local_costmap_topic: "local_costmap/costmap_raw"
    global_costmap_topic: "global_costmap/costmap_raw"

    local_footprint_topic: "local_costmap/published_footprint"
    global_footprint_topic: "global_costmap/published_footprint"

    cycle_frequency: 10.0

    behavior_plugins:
      - "spin"
      - "backup"
      - "drive_on_heading"
      - "assisted_teleop"
      - "wait"

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"

    wait:
      plugin: "nav2_behaviors::Wait"

    local_frame: "odom"
    global_frame: "map"
    robot_base_frame: "base_footprint"

    transform_tolerance: 0.30
    simulate_ahead_time: 2.0

    max_rotational_vel: 0.05
    min_rotational_vel: 0.02
    rotational_acc_lim: 0.10


# ============================================================
# WAYPOINT FOLLOWER
# Permite navegar por varios puntos consecutivos
# ============================================================

waypoint_follower:
  ros__parameters:
    use_sim_time: true

    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200


# ============================================================
# VELOCITY SMOOTHER
#
# Flujo:
# controller_server
#       |
#       v
# /cmd_vel_nav
#       |
#       v
# velocity_smoother
#       |
#       v
# /cmd_vel_smoothed
# ============================================================

velocity_smoother:
  ros__parameters:
    use_sim_time: true

    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    # [linear.x, linear.y, angular.z]
    max_velocity: [0.05, 0.0, 0.05]
    min_velocity: [-0.03, 0.0, -0.05]

    # Aceleraciones progresivas para evitar saltos
    max_accel: [0.05, 0.0, 0.10]
    max_decel: [-0.08, 0.0, -0.15]

    odom_topic: "/odom"
    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

    # ROS 2 Jazzy trabaja con geometry_msgs/msg/Twist
    stamp_smoothed_velocity_with_smoothing_time: false


# ============================================================
# COLLISION MONITOR
#
# Entrada:
#   /cmd_vel_smoothed
#
# Salida final:
#   /cmd_vel
# ============================================================

collision_monitor:
  ros__parameters:
    use_sim_time: true

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"

    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"

    state_topic: "collision_monitor_state"

    transform_tolerance: 0.30
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0

    polygons:
      - "FootprintApproach"

    # Comprueba la posibilidad de una colisión utilizando
    # la huella publicada por el costmap local
    FootprintApproach:
      type: "polygon"
      action_type: "approach"

      footprint_topic: "local_costmap/published_footprint"

      time_before_collision: 1.2
      simulation_time_step: 0.1

      min_points: 6
      visualize: true
      enabled: true

    observation_sources:
      - "scan"

    scan:
      type: "scan"
      topic: "/scan"
      enabled: true
